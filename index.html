<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Search for products on LocalMarket">
    <title>LocalMarket-search</title>
  </head>
  <body>
    <main>
      <h1>Find what you need</h1>
      <p>Search for products on localMarket</p>
      <form action="#" method="get">
        <label for="search">Search products:</label>
        <input 
          type="search"
          id="search"
          name="search" 
          placeholder="Search for products" 
          aria-label="search for products">
        <button>type="submit">search</button>
      </form>
    </main>
  </body>
</html>
