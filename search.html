<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search for products on LocalMarket">
    <title>LocalMarket - Search Products</title>
</head>

<body>

    <header>
        <h1>LocalMarket</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="customer-profile.html">My Profile</a>
        </nav>
    </header>

    <main>
        <h2>Find What You Need</h2>
        <p>Search for products available in your local community.</p>

        <form action="#" method="get">

            <label for="search">Search Products:</label><br>
            <input type="search" id="search" name="search"
                   placeholder="Enter product name">
            <br><br>

            <label for="category">Choose Category:</label><br>
            <select id="category" name="category">
                <option value="">All Categories</option>
                <option value="clothing">Clothing</option>
                <option value="food">Food</option>
                <option value="electronics">Electronics</option>
                <option value="furniture">Furniture</option>
                <option value="handmade">Handmade Products</option>
                <option value="other">Other</option>
            </select>
            <br><br>

            <button type="submit">Search Products</button>
            <button type="reset">Clear</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 LocalMarket. All rights reserved.</p>
    </footer>

</body>
</html>
