<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login| Local Market</title>
</head>

<body>
    <nav>
        <a href="../index.html"> Back to home</a>
    </nav>
    <header>
        <h1>LocalMarket</h1>
    </header>
    <main>
        <section>
            <h2>Welcome Back</h2>
            <p>Don't have an account? <a href="registration.html">Sign Up</a></p>
        </section>
        <section>
            <form action="../index.html">
                <div>
                    <label for="email">Email Address</label><br>
                    <input type="email" value="" id="email" name="email" placeholder="example@gmail.com"
                        autocomplete="email" required /><br>
                </div>
                <div>
                    <label for="password">Password</label><br>
                    <input type="password" value="" id="password" name="password" placeholder="••••••••" required /><br>
                </div>
                <div><br>
                    <button type="Submit">Sign In</button>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
