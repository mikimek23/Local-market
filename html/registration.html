<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration | Local Market</title>
</head>

<body>
    <nav>
        <a href="../index.html"> Back to home</a>
    </nav>
    <header>
        <h1>LocalMarket</h1>
    </header>
    <main>
        <section>
            <h2>Create Your Account</h2>
            <p>Already have an account? <a href="login.html">Sign in</a></p>
        </section>
        <section>
            <form action="../index.html">
                <div>
                    <label for="name">Full name</label><br>
                    <input type="text" value="" id="name" name="name" placeholder="Abebe Kebede" required /><br>
                </div>
                <div>
                    <label for="email">Email Address</label><br>
                    <input type="email" value="" id="email" name="email" placeholder="example@gmail.com"
                        autocomplete="email" required /><br>
                </div>
                <div>
                    <label for="phone">Phone Number</label><br>
                    <input type="tel" value="" id="phone" name="phone" placeholder="+251-"
                        autocomplete="tel-country-code" required /><br>
                </div>
                <div>
                    <label for="password">Password</label><br>
                    <input type="password" value="" id="password" name="password" placeholder="••••••••" required /><br>
                </div>
                <div>
                    <label for="confirm-password">Confirm Password</label><br>
                    <input type="password" value="" id="confirm-password" name="confirm-password"
                        placeholder="••••••••" /><br>
                </div>
                <div><br>
                    <button type="Submit">Create Account</button>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
