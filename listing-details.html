<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listing Details - LocalMarket</title>
    </head>

    <body>
        <header>
            <div>
                <img src="" alt="Local-Market Logo">
                <span>LocalMarket</span>
            </div>
        </header>

        <main>
                
                <p><a href="browse.html">&larr; Back to listings</a></p>
               
               <article id="listing-details">
                <img id="listing-image" src="images/used-bicycle.jpg" alt="Listing image" width="400">
                <h1 id="listing-title">Listing title</h1>

                <p>
                    <span id="listing-type">Product</span>
                    <span id="listing-status">Available</span>
                </p>

                <p id="listing-price">0 Birr</p>

                <h2>Description</h2>
                <p id="listing-description">Full description of the product or service appears here.</p>

                <h2>Details</h2>
                <ul>
                    <li>Category: <span id="listing-category">Category</span></li>
                    <li>Seller: <span id="listing-seller">Seller name</span></li>
                    <li>Location: <span id="listing-location">City</span></li>
                </ul>

                <p>
                    <button type="button" id="favorite-button">Save to favorites</button>
                    <button type="button" id="contact-seller">Contact Seller</button>
                </p>

               </article>

        </main>
    </body>

</html>
