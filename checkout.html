<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - LocalMarket</title>
</head>
<body>

    <header>
        <h1>Secure Checkout</h1>
        <nav>
            <a href="cart.html">← Back to Cart</a>
        </nav>
    </header>

    <main>
        <form action="/process-order" method="POST">
            
            <fieldset>
                <legend>1. Shipping Information</legend>
                
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                <br><br>

                <label for="address">Shipping Address:</label>
                <input type="text" id="address" name="address" required>
            </fieldset>
            <br>

            <fieldset>
                <legend>2. Payment Details</legend>
                
                <label for="cardname">Name on Card:</label>
                <input type="text" id="cardname" name="cardname" required>
                <br><br>

                <label for="cardnumber">Card Number:</label>
                <input type="text" id="cardnumber" name="cardnumber" 
                       pattern="\d{16}" 
                       placeholder="1234 5678 9012 3456" 
                       title="Please enter exactly 16 digits" 
                       required>
                <br><br>

                <label for="expiry">Expiry Date:</label>
                <input type="text" id="expiry" name="expiry" placeholder="MM/YY" pattern="\d{2}/\d{2}" required>
            </fieldset>
            <br>
            <input type="checkbox" id="same-address" name="same-address" checked>
            <label for="same-address">Billing address is the same as shipping</label>
            <button type="submit" style="padding: 10px 20px; font-size: 16px; font-weight: bold;">
                Place Order Securely
            </button>

        </form>
    </main>

    <footer>
        <p><small>&copy; 2026 LocalMarket. All transactions are encrypted.</small></p>
    </footer>

</body>
</html>
